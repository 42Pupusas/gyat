[package]
name = "gyat_browser"
version = "0.1.0"
edition = "2024"

[dependencies]
web-sys = "0.3.77"
yew = { version = "0.21.0", features = ["csr"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
tokio = { version = "1.45.1", features = ["sync"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.100"
idb = { version = "0.6.4" }
serde = { version = "1.0.219", features = ["derive"] }
lucide-yew = "1.2.0"
yew-router = "0.18.0"
nostr-minions = { version = "0.1.18", features = ["bitcoin-qr"] }
gloo = { version = "0.11.0", features = ["timers"] }
serde_json = "1.0.140"

shady-minions = { path = "./shady-minions" }

bitcoin = "0.32.6"
bdk_wallet = { version = "1.2.0", features = ["keys-bip39"] }
bdk_esplora = { version = "0.20.1", features = ["async-https-rustls", "tokio"], default-features = false }

reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
wasm-bindgen-futures = "0.4.50"

